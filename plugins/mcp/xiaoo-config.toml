[llm]
provider = "anthropic"
api_base = "http://127.0.0.1:8000/v1"
model = "GLM-5.2"
api_key_env = "LLM_API_KEY"
max_tokens = 8192
reasoning_effort = "off"

[memory_automation]
enabled = true
server = "ram-a"
recall_top_k = 5
recall_token_budget = 512
context_messages = 4
queue_path = "memory-automation-queue.jsonl"
queue_capacity = 256
max_retries = 5
retry_backoff_ms = 250
allowed_agent_roles = ["main", "defaultagent"]

# If your xiaoO deployment supports a global system prompt, role prompt, or demo prompt,
# add the instruction from ./case-tool-instruction.md so troubleshooting and case-lookup
# questions prefer the RAM-A `memory_case_search` MCP tool before answering from general
# model knowledge.
