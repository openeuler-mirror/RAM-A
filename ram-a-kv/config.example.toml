# ram-a-kv daemon configuration example

listen_addr = "127.0.0.1:6998"
lmcache_url = "http://localhost:6999"
# Set ucm_backend = true to route prefetch through the UCM vllm-router
# (POST {ucm_url}/kv/prefetch) instead of LMCache. Ignored when noop_backend = true.
ucm_backend = false
ucm_url = "http://127.0.0.1:9003"
# Path to libactrail_receiver.so. When set, the daemon loads the actrail-kv
# receiver SDK in-process and forwards turn_end captures to it (fire-and-forget).
# When unset/empty, actrail integration is disabled. Fill in the actual .so
# absolute path to enable; a wrong/missing path makes the daemon refuse to start.
# actrail_sdk_lib = "/usr/lib/actrail-kv/libactrail_receiver.so"
# actrail_analyzer_lib = "/usr/lib/actrail-kv/libactrail_analyzer.so"
# actrail_reporter_lib = "/usr/lib/actrail-kv/libactrail_reporter.so"
# actrail_model_deployment_key = "GLM-5.2"
# actrail_kv_namespace = "default"
# turn_start prefetch: true runs it inline (blocks the caller on the router
# fan-out); turn_start_prefetch_async = true makes it fire-and-forget so the
# fan-out overlaps the caller's next work (e.g. the model call).
turn_start_prefetch = true
turn_start_prefetch_async = false
debug_enabled = false
debug_dir = "kvcache_debug"

# Max in-memory sessions; LRU eviction when exceeded. 0 disables.
# Lower to ~1250 if sessions routinely approach the 4096-chunk limit.
max_sessions = 2000
