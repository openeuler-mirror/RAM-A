[package]
name = "ram-a-kv"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# SQLite session persistence is OFF by default: the default build has no
# rusqlite/libsqlite3-sys dependency (no C compiler needed, nothing linked) and
# the daemon uses an in-memory session store. Build with `--features sqlite` to
# get the durable SQLite-backed store.
default = []
sqlite = ["dep:rusqlite"]

[dependencies]
manager-core = { path = "../manager-core" }
axum.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "macros"] }
rusqlite = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
serde.workspace = true
async-trait.workspace = true
toml.workspace = true
reqwest.workspace = true
thiserror.workspace = true
actrail-kv-sdk.workspace = true
dirs.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
